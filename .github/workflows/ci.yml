name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-lint:
    name: Format, lint, and generator drift
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          cache: true
      - name: Check formatting
        run: mise run format-check
      - name: Lint
        run: mise run lint
      - name: Check generated project
        run: mise run project-check

  tests:
    name: Foundation tests
    runs-on: macos-26
    # This job was observed to genuinely stall mid-run (not merely hang on
    # exit after finishing) on `macos-26` runners: log analysis showed
    # hundreds of unrelated, independent test cases dispatched ("started")
    # within the same millisecond by Swift Testing's default parallel
    # scheduler, then zero further output for many minutes -- consistent
    # with a documented upstream `swift test`/Xcode 26 scheduling issue on
    # this runner image (SwiftPM apple/swift-package-manager#8394,
    # actions/runner-images#13143). `mise run test` now runs with
    # `--no-parallel` (see `mise.toml`) specifically to remove that
    # internal scheduling as a variable. This timeout remains as a
    # defensive resilience measure regardless -- generous over this job's
    # normal ~1-2 minute duration -- so a stuck runner fails fast enough to
    # retry rather than silently consuming the default several-hour job
    # ceiling; it does not weaken, skip, or shorten the tests themselves.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          cache: true
      - name: Run tests
        run: mise run test
      - name: Self-test contract fixture provenance script (offline)
        run: mise run contract-provenance-selftest
      - name: Self-test locale-digest provenance script (offline)
        run: mise run locale-digest-provenance-selftest

  contract-provenance:
    name: Contract fixture provenance
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          cache: true
      - name: Verify vendored fixtures against pinned backend commit
        run: mise run contract-provenance

  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS and iPadOS
            scheme: ArkhamHorror-iOS
            destination: generic/platform=iOS
          - name: macOS
            scheme: ArkhamHorror-macOS
            destination: generic/platform=macOS
          - name: tvOS
            scheme: ArkhamHorror-tvOS
            destination: generic/platform=tvOS
          - name: visionOS
            scheme: ArkhamHorror-visionOS
            destination: generic/platform=visionOS
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          cache: true
      - name: Build
        run: >-
          xcodebuild
          -project ArkhamHorror.xcodeproj
          -scheme "${{ matrix.scheme }}"
          -destination "${{ matrix.destination }}"
          CODE_SIGNING_ALLOWED=NO
          build
