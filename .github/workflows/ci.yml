name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-lint:
    name: Format, lint, and generator drift
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          cache: true
      - name: Check formatting
        run: mise run format-check
      - name: Lint
        run: mise run lint
      - name: Check generated project
        run: mise run project-check

  tests:
    name: Foundation tests
    runs-on: macos-26
    # A documented upstream `swift test`/Xcode 26 "hangs on exit" issue on
    # `macos-26` runners (SwiftPM apple/swift-package-manager#8394,
    # actions/runner-images#13143) can leave this job running long after its
    # actual test work has already finished and passed. This bound is a
    # defensive resilience measure only -- generous over this job's normal
    # ~1-2 minute duration -- so a stuck runner fails fast enough to retry
    # rather than silently consuming the default several-hour job ceiling;
    # it does not weaken, skip, or shorten the tests themselves.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          cache: true
      - name: Run tests
        run: mise run test
      - name: Self-test contract fixture provenance script (offline)
        run: mise run contract-provenance-selftest

  contract-provenance:
    name: Contract fixture provenance
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          cache: true
      - name: Verify vendored fixtures against pinned backend commit
        run: mise run contract-provenance

  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS and iPadOS
            scheme: ArkhamHorror-iOS
            destination: generic/platform=iOS
          - name: macOS
            scheme: ArkhamHorror-macOS
            destination: generic/platform=macOS
          - name: tvOS
            scheme: ArkhamHorror-tvOS
            destination: generic/platform=tvOS
          - name: visionOS
            scheme: ArkhamHorror-visionOS
            destination: generic/platform=visionOS
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          cache: true
      - name: Build
        run: >-
          xcodebuild
          -project ArkhamHorror.xcodeproj
          -scheme "${{ matrix.scheme }}"
          -destination "${{ matrix.destination }}"
          CODE_SIGNING_ALLOWED=NO
          build
