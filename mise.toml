[tools]
swiftformat = "0.62.1"
swiftlint = "0.65.1"
xcodegen = "2.46.0"

[tasks.generate]
description = "Generate the Xcode project"
run = "xcodegen generate"

[tasks.project-check]
description = "Verify the generated Xcode project is current"
run = '''
set -e
xcodegen generate
status="$(git status --short --untracked-files=all -- ArkhamHorror.xcodeproj)"
if [ -n "$status" ]; then
  printf '%s\n' "$status"
  git diff -- ArkhamHorror.xcodeproj
  exit 1
fi
'''

[tasks.format-check]
description = "Check Swift formatting"
run = "swiftformat Sources Packages --lint"

[tasks.lint]
description = "Lint Swift sources"
run = "swiftlint lint --strict"

[tasks.test]
description = "Run pure foundation tests"
# --no-parallel: this suite's own CI job (`macos-26` runners) was observed
# to genuinely stall mid-run under Swift Testing's default massively
# parallel scheduling -- hundreds of unrelated, independent test cases
# (spanning simple synchronous decode tests with no I/O or actor
# involvement, not just this package's own concurrency-heavy asset-cache
# tests) were dispatched ("started") within the same millisecond, then the
# whole process produced zero further output for many minutes until an
# external timeout killed it. Forcing serial execution removes Swift
# Testing's own internal scheduling as a variable entirely; it costs
# roughly 8s instead of ~2s locally for this exact suite (still well
# under any CI budget) and changes nothing about which assertions run or
# how strictly they're checked.
run = "swift test --package-path Packages/ArkhamHorrorShared --no-parallel"

[tasks.contract-provenance]
description = "Verify vendored contract fixtures are byte-identical to the pinned backend commit (network-dependent; not part of the offline test suite)"
run = "Scripts/verify-contract-fixture-provenance.sh"

[tasks.contract-provenance-selftest]
description = "Offline self-test of verify-contract-fixture-provenance.sh's own logic against disposable scratch git repos (no network, part of the offline test suite)"
run = "Scripts/test-verify-contract-fixture-provenance.sh"

[tasks.locale-digest-provenance]
description = "Verify vendored raw locale digest fixtures are byte-identical to the pinned upstream web-client commit (network-dependent; not part of the offline test suite)"
run = "Scripts/verify-locale-digest-provenance.sh"

[tasks.locale-digest-provenance-selftest]
description = "Offline self-test of verify-locale-digest-provenance.sh's own logic against disposable scratch git repos (no network, part of the offline test suite)"
run = "Scripts/test-verify-locale-digest-provenance.sh"

[tasks.build]
description = "Build every application target"
run = """
xcodebuild -project ArkhamHorror.xcodeproj -scheme ArkhamHorror-iOS -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
xcodebuild -project ArkhamHorror.xcodeproj -scheme ArkhamHorror-macOS -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
xcodebuild -project ArkhamHorror.xcodeproj -scheme ArkhamHorror-tvOS -destination 'generic/platform=tvOS' CODE_SIGNING_ALLOWED=NO build
xcodebuild -project ArkhamHorror.xcodeproj -scheme ArkhamHorror-visionOS -destination 'generic/platform=visionOS' CODE_SIGNING_ALLOWED=NO build
"""
