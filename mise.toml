[tools]
swiftformat = "0.62.1"
swiftlint = "0.65.1"
xcodegen = "2.46.0"

[tasks.generate]
description = "Generate the Xcode project"
run = "xcodegen generate"

[tasks.project-check]
description = "Verify the generated Xcode project is current"
run = "xcodegen generate && git diff --exit-code -- ArkhamHorror.xcodeproj"

[tasks.format-check]
description = "Check Swift formatting"
run = "swiftformat Sources Packages --lint"

[tasks.lint]
description = "Lint Swift sources"
run = "swiftlint lint --strict"

[tasks.test]
description = "Run pure foundation tests"
run = "swift test --package-path Packages/ArkhamHorrorShared"

[tasks.build]
description = "Build every application target"
run = """
xcodebuild -project ArkhamHorror.xcodeproj -scheme ArkhamHorror-iOS -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
xcodebuild -project ArkhamHorror.xcodeproj -scheme ArkhamHorror-macOS -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
xcodebuild -project ArkhamHorror.xcodeproj -scheme ArkhamHorror-tvOS -destination 'generic/platform=tvOS' CODE_SIGNING_ALLOWED=NO build
xcodebuild -project ArkhamHorror.xcodeproj -scheme ArkhamHorror-visionOS -destination 'generic/platform=visionOS' CODE_SIGNING_ALLOWED=NO build
"""
